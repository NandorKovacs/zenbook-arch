# Configuration of duo-keyd. Every setting is optional; the values below are
# the defaults. Restart the service after a change:
#
#   sudo systemctl restart 'duo-keyd@*'

# true:  the F-keys send their hotkey, Fn + F-key sends F1-F12
# false: the other way round
#hotkeys_first = true

# Keyboard backlight level to set when the keyboard is docked or connects over
# Bluetooth, 0 (off) to 3.
# Unset: leave it as it is.
#backlight_level = 1

# What each hotkey does: hotkey code = action. The code is the two hex digits
# duo-keyd logs for a key ("unmapped hotkey 35"; see journalctl -u duo-keyd).
# An action is one of
#   KEY_...     press that key (the names are listed in src/keyd/keys.rs)
#   a number    press the key with that Linux key code
#   backlight   step the keyboard backlight to its next level
#   none        ignore the hotkey
[keys]
#10 = KEY_BRIGHTNESSDOWN
#20 = KEY_BRIGHTNESSUP
#c7 = backlight
#7c = KEY_F20               # microphone mute; X calls F20 XF86AudioMicMute
#7e = KEY_PROG1             # emoji key; XF86Launch1
#86 = KEY_PROG2             # MyASUS key; XF86Launch2
#9c = KEY_PROG3             # swap displays key; XF86Launch3
#6a = KEY_SWITCHVIDEOMODE   # lower display key; XF86Display
